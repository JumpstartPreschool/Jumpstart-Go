[project]
name = "jumpstart-tts"
version = "1.0.0"
description = "Jumpstart's gate voice: AI4Bharat Indic Parler-TTS behind a small private HTTP service"
requires-python = "==3.11.*"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "numpy<2",
  "soundfile==0.13.1",
  "torch==2.5.1",
  "torchaudio==2.5.1",
  "parler-tts @ git+https://github.com/huggingface/parler-tts.git@d108732cd57788ec86bc857d99a6cabd66663d68",
]

[dependency-groups]
dev = ["pytest==8.3.5", "httpx==0.28.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
