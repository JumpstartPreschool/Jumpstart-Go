<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Installed on the Home Screen: full screen, content under a translucent status bar (screens pad for the safe area). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jumpstart Go" />
    <meta name="application-name" content="Jumpstart Go" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Light only for now (owner, 2026-09-24); the dark palette waits in src/styles/tokens.css. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#fdfbf8" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The first screen always shows the wordmark and the star: fetch them with the scripts, not after. -->
    <link rel="preload" href="/brand/logo.webp" as="image" fetchpriority="high" />
    <link rel="preload" href="/brand/star.webp" as="image" />
    <meta name="description" content="Pickups, drop-offs and attendance for Jumpstart Preschool, Karve Road." />
    <title>Jumpstart Go</title>
  </head>
  <body class="app-bg">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
